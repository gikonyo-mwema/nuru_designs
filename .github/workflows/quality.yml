name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          DATABASE_URI: ''
          PAYLOAD_SECRET: ci-only-payload-secret-not-valid-for-deployment
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://nuru-designs.example
